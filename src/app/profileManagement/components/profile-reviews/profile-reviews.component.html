<div class="reviews-container">
  <div class="reviews-header">
    <h3>Reseñas</h3>
    <button mat-raised-button color="primary" (click)="createReview()">
      <mat-icon>add</mat-icon> New Review
    </button>
  </div>
  <div *ngIf="loading">Cargando...</div>
  <mat-list *ngIf="!loading">
    <mat-list-item *ngFor="let r of reviews">
      <h4 matLine>{{ r.reviewer }} - {{ r.rating }}/5</h4>
      <p matLine>{{ r.comment }}</p>
      <p matLine class="date">{{ r.date | date:'mediumDate' }}</p>
    </mat-list-item>
  </mat-list>
</div>
